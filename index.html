async function deleteDoc(empId, d) {
  if (!confirm(`Delete ${DOC_KINDS[d.kind] || d.kind}? This cannot be undone.`)) return;
  await sb.storage.from('employee-docs').remove([d.path]);
  const { error } = await sb.from('employee_documents').delete().eq('id', d.id);
  if (error) return alert(`Couldn't delete: ${error.message}`);
  await loadKyc();
  renderDocList(empId);
  renderKyc();
}

function pickDoc(empId, kind) {
  const fi = $('docInput');
  fi.value = '';
  fi.onchange = async () => {
    const f = fi.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024)
      return alert('That file is over 10 MB. Please send a smaller photo.');

    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${empId}/${kind}-${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('employee-docs')
      .upload(path, f, { contentType: f.type, upsert: false });
    if (upErr) return alert(`Upload failed: ${upErr.message}`);

    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from('employee_documents').insert({
      emp_id: String(empId), kind, path, filename: f.name,
      size_bytes: f.size, mime: f.type, uploaded_by: user.id,
    });
    if (error) {
      await sb.storage.from('employee-docs').remove([path]);
      return alert(`Couldn't record the document: ${error.message}`);
    }
    await loadKyc();
    renderDocList(empId);
    renderKyc();
  };
  fi.click();
}

/* ------------------------ import numbers ---------------------------- */
const KYC_HEADERS = ['Employee ID', 'Employee Name', 'Aadhaar Number', 'PAN Number'];
const KYC_MAP = {
  employeeid: 'emp_id', empid: 'emp_id', id: 'emp_id',
  employeename: 'name', empolyeename: 'name', name: 'name',
  aadhaarnumber: 'aadhaar', aadharnumber: 'aadhaar', aadhaarno: 'aadhaar',
  aadharno: 'aadhaar', aadhaar: 'aadhaar', aadhar: 'aadhaar', uid: 'aadhaar',
  pannumber: 'pan', panno: 'pan', pan: 'pan', pancard: 'pan',
};

async function downloadKycTemplate() {
  const XLSX = await loadSheetJS();
  const aoa = [KYC_HEADERS,
    ['6', 'Tushar Lakhmani', '234567890124', 'ABCDE1234F'],
    ['8', 'Sachin Kumar', '999999990019', 'PQRSX5678G']];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ['A', 'C'].forEach((col) => {
    for (let r = 2; r <= aoa.length; r++) {
      const c = ws[col + r];
      if (c && c.v !== '') { c.t = 's'; c.v = String(c.v); c.z = '@'; }
    }
  });
  ws['!cols'] = [{ wch: 12 }, { wch: 24 }, { wch: 18 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'KYC');
  XLSX.writeFile(wb, 'kyc-template.xlsx');
}

function pickKycFile() {
  const fi = $('fileInput');
  fi.value = '';
  fi.onchange = () => { if (fi.files[0]) parseKyc(fi.files[0]); };
  fi.click();
}

async function parseKyc(file) {
  let gridF, gridR;
  try {
    const XLSX = await loadSheetJS();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sh = wb.Sheets[wb.SheetNames[0]];
    gridF = XLSX.utils.sheet_to_json(sh, { header: 1, blankrows: false, defval: '', raw: false });
    gridR = XLSX.utils.sheet_to_json(sh, { header: 1, blankrows: false, defval: '', raw: true });
  } catch (e) { return alert(`Couldn't read that file: ${e.message}`); }
  if (!gridF || gridF.length < 2) return alert('That sheet looks empty.');

  const score = (row) => (row || []).map(normKey).filter((h) => KYC_MAP[h]).length;
  let hdr = 0, best = -1;
  for (let r = 0; r < Math.min(15, gridF.length); r++) {
    const sc = score(gridF[r]);
    if (sc > best) { best = sc; hdr = r; }
  }
  const cols = {};
  gridF[hdr].map(normKey).forEach((h, i) => {
    const f = KYC_MAP[h];
    if (f && cols[f] === undefined) cols[f] = i;
  });
  if (cols.emp_id === undefined)
    return alert('No "Employee ID" column found. Numbers are matched by Employee ID only.');
  if (cols.aadhaar === undefined && cols.pan === undefined)
    return alert('No "Aadhaar Number" or "PAN Number" column found.');

  const cell = (r, f) => {
    const i = cols[f];
    if (i === undefined) return '';
    const rv = gridR[r]?.[i];
    if (typeof rv === 'number' && isFinite(rv))
      return Number.isInteger(rv) ? rv.toFixed(0) : String(rv);
    return String(gridF[r]?.[i] ?? '').trim();
  };

  const known = new Map(staff.map((e) => [String(e.emp_id).toLowerCase(), e]));
  const good = [], bad = [];
  for (let r = hdr + 1; r < gridF.length; r++) {
    if (!gridF[r] || gridF[r].every((c) => String(c ?? '').trim() === '')) continue;
    const id = cell(r, 'emp_id');
    const a = cleanAadhaar(cell(r, 'aadhaar'));
    const pan = cell(r, 'pan').toUpperCase().trim();
    const why = [];
    if (!id) why.push('no Employee ID');
    else if (!known.has(id.toLowerCase())) why.push('Employee ID not in the register');
    if (a && a.length !== 12) why.push(`Aadhaar has ${a.length} digits, not 12`);
    else if (a && !aadhaarValid(a)) why.push('Aadhaar check digit fails');
    if (pan && !panValid(pan)) why.push('PAN format wrong');
    if (!a && !pan) why.push('nothing to import');
    if (why.length) { bad.push({ line: r + 1, who: cell(r, 'name') || id || '—', why: why.join(', ') }); continue; }
    good.push({ emp_id: id, name: known.get(id.toLowerCase()).name, aadhaar: a, pan });
  }

  openModal('Import KYC numbers', `
    <div style="margin-bottom:14px">
      <span class="pill pill-new">${good.length} to save</span>
      ${bad.length ? `<span class="pill pill-bad">${bad.length} skipped</span>` : ''}
    </div>
    ${good.length ? `<div class="preview"><table>
      <thead><tr><th>ID</th><th>Name</th><th>Aadhaar</th><th>PAN</th></tr></thead><tbody>
      ${good.slice(0, 200).map((g) => `<tr>
        <td class="mono">${esc(g.emp_id)}</td><td>${esc(g.name)}</td>
        <td class="mono">${esc(maskAadhaar(g.aadhaar))}</td>
        <td class="mono">${esc(g.pan)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p style="font-size:14px">Nothing can be imported.</p>'}
    ${bad.length ? `<p class="eyebrow" style="margin:18px 0 6px">Skipped</p>
      <div class="preview"><table>
      <thead><tr><th>Row</th><th>Who</th><th>Problem</th></tr></thead><tbody>
      ${bad.map((b) => `<tr class="badrow"><td class="mono">${b.line}</td>
        <td>${esc(b.who)}</td><td>${esc(b.why)}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    <div id="kycImpErr" class="err hidden"></div>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-green" id="doKycImport" ${good.length ? '' : 'disabled'}>
        Save ${good.length}</button>
    </div>`, 'lg');

  $('doKycImport').onclick = async () => {
    const btn = $('doKycImport');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { data: { user } } = await sb.auth.getUser();
    const payload = good.map((g) => ({
      emp_id: g.emp_id,
      aadhaar_no: g.aadhaar || null,
      pan_no: g.pan || null,
      updated_by: user.id,
    }));
    const { error } = await sb.from('employee_kyc')
      .upsert(payload, { onConflict: 'emp_id' });
    if (error) {
      btn.disabled = false; btn.textContent = 'Try again';
      const e = $('kycImpErr');
      e.textContent = `Couldn't save: ${error.message}`;
      e.classList.remove('hidden');
      return;
    }
    closeModal();
    await loadKyc();
    renderKyc();
  };
}

let settings = { company_name: 'Rio', company_address: '', payslip_footer: '' };

async function loadSettings() {
  const { data } = await sb.from('app_settings').select('key, value');
  (data || []).forEach((r) => { settings[r.key] = r.value || ''; });
}

const W_ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight',
  'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
  'Seventeen', 'Eighteen', 'Nineteen'];
const W_TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy',
  'Eighty', 'Ninety'];
const w2 = (n) => n < 20 ? W_ONES[n] : W_TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + W_ONES[n % 10] : '');
const w3 = (n) => (n >= 100 ? W_ONES[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '')
                + (n % 100 ? w2(n % 100) : '');

function inWords(amount) {
  const neg = amount < 0;
  let n = Math.floor(Math.abs(amount));
  const paise = Math.round((Math.abs(amount) - n) * 100);
  if (n === 0 && !paise) return 'Zero Rupees Only';
  const parts = [];
  const cr = Math.floor(n / 10000000); n %= 10000000;
  const la = Math.floor(n / 100000);   n %= 100000;
  const th = Math.floor(n / 1000);     n %= 1000;
  if (cr) parts.push(w3(cr) + ' Crore');
  if (la) parts.push(w2(la) + ' Lakh');
  if (th) parts.push(w2(th) + ' Thousand');
  if (n)  parts.push(w3(n));
  let s = (neg ? 'Minus ' : '') + parts.join(' ') + ' Rupees';
  if (paise) s += ' and ' + w2(paise) + ' Paise';
  return s + ' Only';
}

const rup = (v) => '₹' + (Math.round((Number(v) || 0) * 100) / 100)
  .toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const last4 = (v) => {
  const d = String(v || '').replace(/\s/g, '');
  return d ? '••••' + d.slice(-4) : '—';
};

/* --------------------------- one payslip ---------------------------- */
function payslipHtml({ emp, calc, advanceBy }, period, label) {
  const earn = [
    ['Salary for days paid', calc.amount],
    calc.extra_amount ? [`Extra days (${calc.extra_days}${calc.holidays_worked ? ` + ${calc.holidays_worked} holiday worked` : ''})`, calc.extra_amount] : null,
    calc.ot_amount ? [`Overtime (${calc.ot_hours.toFixed(1)} hrs)`, calc.ot_amount] : null,
    calc.incentive ? ['Incentive', calc.incentive] : null,
    calc.expenses ? ['Expenses / reimbursement', calc.expenses] : null,
  ].filter(Boolean);

  const ded = [
    calc.pf ? ['Provident Fund', calc.pf] : null,
    calc.tds ? ['TDS', calc.tds] : null,
    calc.advance ? [`Advance / penalty${advanceBy ? ` (${advanceBy})` : ''}`, calc.advance] : null,
  ].filter(Boolean);

  const totalEarn = earn.reduce((s, [, v]) => s + v, 0);
  const totalDed = ded.reduce((s, [, v]) => s + v, 0);

  return `
  <div class="slip">
    <div class="slip-head">
      <div>
        <div class="co">${esc(settings.company_name || 'Company')}</div>
        ${settings.company_address ? `<div class="co-addr">${esc(settings.company_address)}</div>` : ''}
      </div>
      <div class="slip-period">
        <div class="lbl">Payslip for</div>
        <div class="per">${esc(label)}</div>
      </div>
    </div>

    <table class="who">
      <tr><td class="k">Name</td><td class="v">${esc(emp.name)}</td>
          <td class="k">Employee ID</td><td class="v">${esc(emp.emp_id)}</td></tr>
      <tr><td class="k">Designation</td><td class="v">${esc(emp.designation || '—')}</td>
          <td class="k">Area</td><td class="v">${esc(emp.area || '—')}</td></tr>
      <tr><td class="k">Bank</td><td class="v">${esc(emp.bank_name || '—')}</td>
          <td class="k">Account</td><td class="v">${esc(last4(emp.account_no))}</td></tr>
    </table>

    <table class="days">
      <tr>
        <th>Days in month</th><th>Present</th><th>Week off</th><th>Paid leave</th>
        <th>Holiday</th><th>Absent</th><th>Extra days</th>
      </tr>
      <tr>
        <td>${calc.days_in_month}</td><td>${calc.present}</td><td>${calc.week_off}</td>
        <td>${calc.paid_leave}</td><td>${calc.paid_holiday}</td>
        <td>${calc.absent}</td><td>${calc.extra_days}</td>
      </tr>
    </table>

    <div class="cols">
      <table class="money">
        <tr><th colspan="2">Earnings</th></tr>
        ${earn.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${rup(v)}</td></tr>`).join('')}
        <tr class="tot"><td>Total earnings</td><td class="r">${rup(totalEarn)}</td></tr>
      </table>

      <table class="money">
        <tr><th colspan="2">Deductions</th></tr>
        ${ded.length ? ded.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${rup(v)}</td></tr>`).join('')
                     : '<tr><td colspan="2" class="none">None</td></tr>'}
        <tr class="tot"><td>Total deductions</td><td class="r">${rup(totalDed)}</td></tr>
      </table>
    </div>

    <div class="net">
      <div>
        <div class="lbl">Net pay</div>
        <div class="words">${esc(inWords(calc.final))}</div>
      </div>
      <div class="amt">${rup(calc.final)}</div>
    </div>

    ${calc.notes.length ? `<div class="notes">${esc(calc.notes.join(' · '))}</div>` : ''}
    ${settings.payslip_footer ? `<div class="foot-note">${esc(settings.payslip_footer)}</div>` : ''}
  </div>`;
}

function openPayslip(row) {
  openModal(`Payslip — ${row.emp.name}`, `
    <style>${SLIP_CSS}</style>
    ${payslipHtml(row, currentRun.period, currentRun.label)}
    <div class="foot">
      <button class="btn btn-ghost" data-close>Close</button>
      <button class="btn btn-green" id="printSlip">Print / save as PDF</button>
    </div>`, 'lg');
  $('printSlip').onclick = () => printSlips([row]);
}

function printSlips(rows) {
  const w = window.open('', '_blank');
  if (!w) return alert('Your browser blocked the print window. Allow pop-ups for this site.');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>Payslips — ${esc(currentRun.label)}</title><style>
    body{background:#EFF1EE;margin:0;padding:18px}${SLIP_CSS}</style></head><body>
    ${rows.map((r) => payslipHtml(r, currentRun.period, currentRun.label)).join('')}
    </body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

/* ------------------------------ modal ------------------------------ */
function openModal(title, bodyHtml, size = '') {
  $('modalHost').innerHTML = `
    <div class="veil">
      <div class="modal ${size}">
        <div class="head"><h2>${esc(title)}</h2>
          <button class="iconbtn" data-close style="font-size:18px">✕</button></div>
        <div class="body">${bodyHtml}</div>
      </div>
    </div>`;
  $('modalHost').querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeModal));
  $('modalHost').querySelector('.veil').onclick = (e) => {
    if (e.target.classList.contains('veil')) closeModal();
  };
}
function closeModal() { $('modalHost').innerHTML = ''; }
