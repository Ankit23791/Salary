<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RapidSurge Payroll</title>
<style>
  :root{
    --ink:#1B2A2F; --ink-soft:#3D5158; --muted:#7A8C90;
    --paper:#EFF1EE; --card:#fff; --line:#D7DDD9;
    --green:#0F7B5F; --green-soft:#E3F1EC;
    --amber:#9A6410; --amber-soft:#F6EEDD;
    --rose:#9E3B3B;  --rose-soft:#F5E5E5;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
  .wordmark{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.5px}
  .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;
           letter-spacing:.12em;color:var(--ink-soft)}
  .hidden{display:none !important}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .box{width:100%;max-width:380px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
      border-radius:6px;font-size:14px;color:var(--ink);background:#fff;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
  label.f{display:block;margin:0 0 6px}
  .btn{border:0;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;
       display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-green{background:var(--green);color:#fff;font-weight:500}
  .btn-rose{background:var(--rose);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--rose);font-size:13.5px;margin-top:12px}

  header{background:var(--ink)}
  .bar{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;
       align-items:center;justify-content:space-between;gap:16px}
  .bar .wordmark{color:#fff;font-size:22px}
  .whoami{font-family:var(--mono);font-size:11px;background:#2C4046;color:#CFE0DA;
          padding:4px 9px;border-radius:5px}
  .linkbtn{background:none;border:0;color:#fff;opacity:.75;cursor:pointer;
           font-size:14px;font-family:inherit}
  .linkbtn:hover{opacity:1}

  main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}

  .strip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
         gap:20px;padding:18px 20px;margin-bottom:20px}
  .payout{font-family:var(--mono);font-size:44px;color:var(--green);line-height:1.05}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
  .stats{display:flex;gap:26px;font-family:var(--mono)}
  .stats .n{font-size:22px}
  .stats .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .controls input,.controls select{width:auto}
  .controls .search{flex:1;min-width:200px}

  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
  thead th{background:#F5F7F5;text-align:left;font-weight:400;padding:10px 14px;
           font-family:var(--mono);font-size:11px;text-transform:uppercase;
           letter-spacing:.08em;color:var(--ink-soft);white-space:nowrap}
  tbody td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr.off{opacity:.55}
  .r{text-align:right}
  .tag{display:inline-block;font-family:var(--mono);font-size:11px;
       padding:4px 8px;border-radius:5px;border:1px solid transparent}
  .tag-ft{background:var(--green-soft);color:var(--green)}
  .tag-pt{background:var(--amber-soft);color:var(--amber)}
  .tag-on{background:var(--green-soft);color:var(--green);border-color:var(--green);cursor:pointer}
  .tag-off{background:var(--rose-soft);color:var(--rose);cursor:pointer}
  .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
  .iconbtn{background:none;border:0;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:5px}
  .iconbtn:hover{background:#F0F2F0}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)}

  .veil{position:fixed;inset:0;background:rgba(27,42,47,.45);display:flex;
        align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:50}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:640px;margin:32px 0}
  .modal.sm{max-width:420px}
  .modal.lg{max-width:820px}
  .modal .head{display:flex;align-items:center;justify-content:space-between;
               padding:14px 20px;border-bottom:1px solid var(--line)}
  .modal .head h2{margin:0;font-family:Georgia,serif;font-size:19px;font-weight:400}
  .modal .body{padding:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;
              border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-soft);font-family:inherit}
  .seg button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .check{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;cursor:pointer}
  .check input{width:auto}
  textarea.csv{height:220px;font-family:var(--mono);font-size:11.5px;resize:vertical}

  /* import */
  .drop{border:2px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;
        cursor:pointer;background:#FAFBFA}
  .drop:hover,.drop.over{border-color:var(--green);background:var(--green-soft)}
  .cols{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
  .cols td,.cols th{padding:6px 10px;border:1px solid var(--line);text-align:left}
  .cols th{background:#F5F7F5;font-weight:500;font-family:var(--mono);font-size:11px;
           text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;
        font-family:var(--mono);margin-right:8px}
  .pill-new{background:var(--green-soft);color:var(--green)}
  .pill-upd{background:var(--amber-soft);color:var(--amber)}
  .pill-bad{background:var(--rose-soft);color:var(--rose)}
  .preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .badrow{background:var(--rose-soft)}

  /* nav + payroll */
  .nav{display:flex;gap:4px}
  .nav button{background:none;border:0;color:#8FA5A9;cursor:pointer;font-size:14px;
              padding:6px 12px;border-radius:6px;font-family:inherit}
  .nav button.on{background:#2C4046;color:#fff}
  .runbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
          padding:16px 20px;margin-bottom:18px}
  .sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .sheet{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px}
  .sheet h3{margin:0 0 2px;font-size:15px;font-weight:600}
  .sheet .cols{margin:10px 0 12px}
  .sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;
       vertical-align:middle}
  .dot-empty{background:var(--line)}
  .dot-ok{background:var(--green)}
  .dot-warn{background:var(--amber)}
  .runrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
          padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
  .runrow:hover{background:#F5F7F5}
  .fieldlist{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.7}

  @media(max-width:640px){
    .grid2{grid-template-columns:1fr}
    .payout{font-size:34px}
    .stats{gap:18px}
    .whoami{display:none}
  }
</style>
</head>
<body>

<!-- ------------------------------ LOGIN ------------------------------ -->
<section id="login">
  <div class="box">
    <div style="margin-bottom:26px">
      <div class="wordmark" style="font-size:34px">RapidSurge Payroll</div>
      <div class="eyebrow" style="margin-top:4px">Staff &amp; salary register</div>
    </div>
    <div class="card" style="padding:22px">
      <label class="f eyebrow" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      <label class="f eyebrow" for="password" style="margin-top:16px">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div id="loginErr" class="err hidden"></div>
      <button id="loginBtn" class="btn btn-dark" style="width:100%;justify-content:center;margin-top:20px">
        Open register
      </button>
    </div>
    <p class="note" style="margin-top:16px">
      Accounts are created in Supabase. Ask the main account holder to add you.
    </p>
  </div>
</section>

<!-- ------------------------------ APP -------------------------------- -->
<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div style="display:flex;align-items:center;gap:18px">
        <span class="wordmark">RapidSurge Payroll</span>
        <nav class="nav">
          <button id="navStaff" class="on">Staff</button>
          <button id="navPayroll">Payroll</button>
        </nav>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span id="whoami" class="whoami"></span>
        <button id="logoutBtn" class="linkbtn">Sign out</button>
      </div>
    </div>
  </header>

  <main>
   <div id="staffView">
    <section class="card strip">
      <div>
        <div class="eyebrow" id="payoutLabel">Monthly payout</div>
        <div class="payout" id="payout">₹0</div>
        <div class="note">Active staff only. Inactive staff stay on file but drop out of the total.</div>
      </div>
      <div class="stats">
        <div><div class="n" id="sListed">0</div><div class="l">Listed</div></div>
        <div><div class="n" id="sActive">0</div><div class="l">Active</div></div>
        <div><div class="n" id="sFull">0</div><div class="l">Full time</div></div>
        <div><div class="n" id="sPart">0</div><div class="l">Part time</div></div>
      </div>
    </section>

    <div class="controls">
      <input class="search" id="q" placeholder="Search name, ID, bank, account" />
      <select id="fArea"><option value="all">All areas</option></select>
      <select id="fDesig"><option value="all">All designations</option></select>
      <select id="fType">
        <option value="all">Full + part time</option>
        <option value="Full Time">Full time</option>
        <option value="Part Time">Part time</option>
      </select>
      <select id="fStatus">
        <option value="all">Active + inactive</option>
        <option value="active">Active only</option>
        <option value="inactive">Inactive only</option>
      </select>
      <button id="clearBtn" class="btn btn-ghost hidden">Clear filters</button>
      <button id="exportBtn" class="btn btn-ghost">Export</button>
      <button id="importBtn" class="btn btn-ghost hidden">Import Excel</button>
      <button id="addBtn" class="btn btn-green hidden">+ Add employee</button>
    </div>

    <div class="wrap" id="tableWrap"></div>
    <p class="note" id="footNote" style="margin-top:10px"></p>
   </div>

   <div id="payrollView" class="hidden"></div>
  </main>
</div>

<div id="modalHost"></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden" />

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ===================================================================
   PASTE YOUR SUPABASE DETAILS HERE
   Project Settings → API Keys. Use the anon / publishable key.
   =================================================================== */
const SUPABASE_URL = 'https://vphmuuhnfqluvhtdpbhb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2hAro_6cC50VDF77uiQHTw_QohUNhKe';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ------------------------------ state ------------------------------ */
let profile = null;
let staff = [];
const filters = { q: '', area: 'all', desig: 'all', type: 'all', status: 'all' };
const isMain = () => profile?.role === 'main';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => new Intl.NumberFormat('en-IN',
  { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Number(n) || 0);

/* ------------------------------ auth ------------------------------- */
$('loginBtn').onclick = signIn;
$('password').onkeydown = (e) => { if (e.key === 'Enter') signIn(); };
$('email').onkeydown = (e) => { if (e.key === 'Enter') $('password').focus(); };
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function signIn() {
  const btn = $('loginBtn'), errEl = $('loginErr');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Checking…';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  btn.disabled = false; btn.textContent = 'Open register';
  if (error) {
    // show the real reason, not a guess
    errEl.textContent = error.message;
    errEl.classList.remove('hidden');
    return;
  }
  await start();
}

async function start() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { data: p } = await sb.from('profiles')
    .select('full_name, role').eq('id', user.id).single();
  profile = p || { full_name: user.email, role: 'secondary' };

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoami').textContent =
    `${profile.full_name} · ${isMain() ? 'main account' : 'view only'}`;
  $('addBtn').classList.toggle('hidden', !isMain());
  $('importBtn').classList.toggle('hidden', !isMain());

  await load();
}

/* ------------------------------ data ------------------------------- */
async function load() {
  const { data, error } = await sb.from('employees').select('*').order('name');
  if (error) {
    $('tableWrap').innerHTML =
      `<div class="empty">Couldn't load the register: ${esc(error.message)}</div>`;
    return;
  }
  staff = data || [];
  refreshLists();
  render();
}

function fillSelect(sel, values, allLabel, current) {
  sel.innerHTML = `<option value="all">${allLabel}</option>` +
    values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = values.includes(current) ? current : 'all';
  return sel.value;
}

function refreshLists() {
  const areas = [...new Set(staff.map((e) => e.area).filter(Boolean))].sort();
  const titles = [...new Set(staff.map((e) => e.designation).filter(Boolean))].sort();
  filters.area = fillSelect($('fArea'), areas, 'All areas', filters.area);
  filters.desig = fillSelect($('fDesig'), titles, 'All designations', filters.desig);
}

function visible() {
  const n = filters.q.trim().toLowerCase();
  return staff.filter((e) => {
    if (filters.area !== 'all' && e.area !== filters.area) return false;
    if (filters.desig !== 'all' && e.designation !== filters.desig) return false;
    if (filters.type !== 'all' && e.emp_type !== filters.type) return false;
    if (filters.status === 'active' && !e.active) return false;
    if (filters.status === 'inactive' && e.active) return false;
    if (n) {
      const hay = `${e.emp_id} ${e.name} ${e.area} ${e.designation} ${e.bank_name} ${e.account_no} ${e.ifsc}`.toLowerCase();
      if (!hay.includes(n)) return false;
    }
    return true;
  });
}

function filterLabel() {
  return [
    filters.area === 'all' ? null : filters.area,
    filters.desig === 'all' ? null : filters.desig,
    filters.type === 'all' ? null : filters.type,
    filters.status === 'all' ? 'all staff' : filters.status,
  ].filter(Boolean).join(' · ');
}

/* ----------------------------- render ------------------------------ */
function render() {
  const rows = visible();
  const active = rows.filter((e) => e.active);

  $('payoutLabel').textContent = `Monthly payout — ${filterLabel()}`;
  $('payout').textContent = money(active.reduce((s, e) => s + Number(e.monthly_salary || 0), 0));
  $('sListed').textContent = rows.length;
  $('sActive').textContent = active.length;
  $('sFull').textContent = active.filter((e) => e.emp_type === 'Full Time').length;
  $('sPart').textContent = active.filter((e) => e.emp_type === 'Part Time').length;

  const dirty = filters.q || filters.area !== 'all' || filters.desig !== 'all'
                || filters.type !== 'all' || filters.status !== 'all';
  $('clearBtn').classList.toggle('hidden', !dirty);

  $('footNote').textContent =
    `${staff.length} employee${staff.length === 1 ? '' : 's'} on file` +
    (isMain() ? '' : ' · secondary account, entries are read only');

  if (!rows.length) {
    $('tableWrap').innerHTML = `<div class="empty">${
      staff.length
        ? 'No employee matches these filters. Clear them to see the full register.'
        : (isMain()
            ? 'The register is empty. Add your first employee, or import a sheet.'
            : 'The register is empty. The main account needs to add staff first.')
    }</div>`;
    return;
  }

  $('tableWrap').innerHTML = `
    <table>
      <thead><tr>
        <th>Employee</th><th>Bank details</th><th>Area</th><th>Designation</th><th>Type</th>
        <th class="r">Monthly salary</th><th>Status</th>${isMain() ? '<th class="r">Edit</th>' : ''}
      </tr></thead>
      <tbody>${rows.map(rowHtml).join('')}</tbody>
    </table>`;

  $('tableWrap').querySelectorAll('[data-toggle]').forEach((b) => {
    b.onclick = () => toggleActive(b.dataset.toggle);
  });
  $('tableWrap').querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => openForm(staff.find((e) => e.id === b.dataset.edit));
  });
  $('tableWrap').querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = () => confirmDelete(staff.find((e) => e.id === b.dataset.del));
  });
}

function rowHtml(e) {
  const ft = e.emp_type === 'Full Time';
  const status = isMain()
    ? `<button class="tag ${e.active ? 'tag-on' : 'tag-off'}" data-toggle="${e.id}"
         title="${e.active ? 'Mark inactive' : 'Mark active'}">${e.active ? 'Active' : 'Inactive'}</button>`
    : `<span class="tag ${e.active ? 'tag-on' : 'tag-off'}" style="cursor:default">${e.active ? 'Active' : 'Inactive'}</span>`;
  return `
    <tr class="${e.active ? '' : 'off'}">
      <td><div style="font-weight:500">${esc(e.name)}</div><div class="sub">${esc(e.emp_id)}</div></td>
      <td class="sub"><div style="color:var(--ink)">${esc(e.bank_name || '—')}</div>
          <div>A/c ${esc(e.account_no || '—')}</div><div>${esc(e.ifsc || '—')}</div></td>
      <td>${esc(e.area || '—')}</td>
      <td>${esc(e.designation || '—')}</td>
      <td><span class="tag ${ft ? 'tag-ft' : 'tag-pt'}">${esc(e.emp_type || '—')}</span></td>
      <td class="r mono">${money(e.monthly_salary)}</td>
      <td>${status}</td>
      ${isMain() ? `<td class="r" style="white-space:nowrap">
        <button class="iconbtn" data-edit="${e.id}" title="Edit">✎</button>
        <button class="iconbtn" data-del="${e.id}" title="Remove" style="color:var(--rose)">🗑</button>
      </td>` : ''}
    </tr>`;
}

/* ----------------------------- filters ----------------------------- */
$('q').oninput = (e) => { filters.q = e.target.value; render(); };
$('fArea').onchange = (e) => { filters.area = e.target.value; render(); };
$('fDesig').onchange = (e) => { filters.desig = e.target.value; render(); };
$('fType').onchange = (e) => { filters.type = e.target.value; render(); };
$('fStatus').onchange = (e) => { filters.status = e.target.value; render(); };
$('clearBtn').onclick = () => {
  filters.q = ''; filters.area = 'all'; filters.desig = 'all';
  filters.type = 'all'; filters.status = 'all';
  $('q').value = ''; $('fArea').value = 'all'; $('fDesig').value = 'all';
  $('fType').value = 'all'; $('fStatus').value = 'all';
  render();
};

/* ------------------------------ writes ----------------------------- */
async function toggleActive(id) {
  const emp = staff.find((e) => e.id === id);
  const { error } = await sb.from('employees').update({ active: !emp.active }).eq('id', id);
  if (error) return alert(`Couldn't update ${emp.name}: ${error.message}`);
  emp.active = !emp.active;
  render();
}

function confirmDelete(emp) {
  openModal('Remove employee', `
    <p style="margin:0;font-size:14px">Removing <b>${esc(emp.name)}</b> (${esc(emp.emp_id)})
    deletes the record permanently. To keep the record but stop the salary,
    mark the employee inactive instead.</p>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Keep employee</button>
      <button class="btn btn-rose" id="doDelete">Remove</button>
    </div>`, 'sm');
  $('doDelete').onclick = async () => {
    const { error } = await sb.from('employees').delete().eq('id', emp.id);
    if (error) return alert(`Couldn't remove: ${error.message}`);
    staff = staff.filter((e) => e.id !== emp.id);
    closeModal(); refreshLists(); render();
  };
}

$('addBtn').onclick = () => openForm(null);

function openForm(emp) {
  const v = emp || { emp_type: 'Full Time', active: true };
  const areas = [...new Set(staff.map((e) => e.area).filter(Boolean))].sort();
  const titles = [...new Set(staff.map((e) => e.designation).filter(Boolean))].sort();
  openModal(emp ? 'Edit employee' : 'Add employee', `
    <div class="grid2">
      <div><label class="f eyebrow">Employee ID</label>
        <input id="fEmpId" class="mono" placeholder="EMP-001" value="${esc(v.emp_id || '')}"></div>
      <div><label class="f eyebrow">Employee name</label>
        <input id="fName" placeholder="Full name" value="${esc(v.name || '')}"></div>

      name: $('fName').value.trim(),
      bank_name: $('fBank').value.trim(),
      account_no: $('fAcc').value.trim(),

    if (!payload.emp_id) return show('Employee ID is required.');
    if (!payload.name) return show('Employee name is required.');
    if (!payload.area) return show('Area is required — the area filter depends on it.');
    if ($('fSalary').value === '' || payload.monthly_salary < 0)
      return show('Enter the monthly salary as a number.');

    $('saveBtn').disabled = true;
    const q = emp
      ? sb.from('employees').update(payload).eq('id', emp.id)
      : sb.from('employees').insert(payload);
    const { error } = await q;
    $('saveBtn').disabled = false;

    if (error) {
      return show(error.code === '23505'
        ? `Employee ID ${payload.emp_id} is already used by someone else.`
        : `Couldn't save: ${error.message}`);
    }
    closeModal();
    await load();
  };
}

// header text → our field name. Anything unrecognised is ignored.
const HEADER_MAP = {
  employeeid: 'emp_id', empid: 'emp_id', id: 'emp_id', code: 'emp_id', empcode: 'emp_id',
  name: 'name', employeename: 'name', staffname: 'name', empname: 'name',
  bank: 'bank_name', bankname: 'bank_name',
  accountno: 'account_no', accountnumber: 'account_no', account: 'account_no',
  acno: 'account_no', ac: 'account_no', bankaccount: 'account_no',
  ifsc: 'ifsc', ifsccode: 'ifsc',
  area: 'area', location: 'area', branch: 'area', zone: 'area',
  designation: 'designation', jobtitle: 'designation', title: 'designation',
  post: 'designation', role: 'designation', profile: 'designation',
  employmenttype: 'emp_type', emptype: 'emp_type', type: 'emp_type',
  employment: 'emp_type', workingtype: 'emp_type', stafftype: 'emp_type',
  fulltimeparttime: 'emp_type', parttimefulltime: 'emp_type',
  salary: 'monthly_salary', monthlysalary: 'monthly_salary', pay: 'monthly_salary',
  monthlypay: 'monthly_salary', wage: 'monthly_salary',
  status: 'active', active: 'active',
};

const normKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

async function loadSheetJS() {
  if (window.XLSX) return window.XLSX;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('Could not load the Excel reader. Check your connection.'));
    document.head.appendChild(s);
  });
  return window.XLSX;
}

async function handleFile(file) {
  const errEl = $('importErr');
  const fail = (m) => { errEl.textContent = m; errEl.classList.remove('hidden'); };
  errEl.classList.add('hidden');
  $('drop').innerHTML = '<div style="font-size:15px">Reading the file…</div>';

  let gridF, gridR;
  try {
    const XLSX = await loadSheetJS();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    // Two passes. raw:false gives what Excel shows on screen, which keeps
    // leading zeros in Text columns. raw:true gives the underlying value,
    // which is what we need when Excel is displaying 5.01008E+13.
    gridF = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '', raw: false });
    gridR = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '', raw: true });
  } catch (e) {
    return fail(`Couldn't read that file: ${e.message}`);
  }

  const grid = gridF;

  if (!grid || grid.length < 2)
    return fail('That sheet looks empty. It needs a heading row plus at least one employee.');

  // map headings
  const headers = grid[0].map(normKey);
  const cols = {};
  headers.forEach((h, i) => { if (HEADER_MAP[h] && cols[HEADER_MAP[h]] === undefined) cols[HEADER_MAP[h]] = i; });

  const missing = ['emp_id', 'name', 'area', 'monthly_salary'].filter((f) => cols[f] === undefined);
  if (missing.length) {
    const nice = { emp_id: 'Employee ID', name: 'Name', area: 'Area', monthly_salary: 'Monthly Salary' };
    return fail(`Couldn't find these columns: ${missing.map((m) => nice[m]).join(', ')}. ` +
                `The first row of the sheet must be the headings.`);
  }

  // For each cell decide which of the two readings to trust.
  // Text cell  → the displayed string, so 0123456789 keeps its zero.
  // Number cell → the underlying number written out in full, so a 14-digit
  //               account number never arrives as 5.01008E+13.
  const cell = (r, field) => {
    const i = cols[field];
    if (i === undefined) return '';
    const rawv = gridR[r]?.[i];
    if (typeof rawv === 'number' && isFinite(rawv)) {
      return Number.isInteger(rawv) ? rawv.toFixed(0) : String(rawv);
    }
    const shown = String(gridF[r]?.[i] ?? '').trim();
    return shown || String(rawv ?? '').trim();
  };
  const has = (f) => cols[f] !== undefined;
  const byEmpId = new Map(staff.map((e) => [e.emp_id.toLowerCase(), e]));
  const seen = new Map();
  const good = [], bad = [];

  for (let r = 1; r < grid.length; r++) {
    const row = grid[r];
    if (!row || row.every((c) => String(c ?? '').trim() === '')) continue;

    const empId = cell(r, 'emp_id');
    const name = cell(r, 'name');
    const area = cell(r, 'area');
    const rawSalary = cell(r, 'monthly_salary').replace(/[₹,\s]/g, '');
    const salary = Number(rawSalary);

    const problems = [];
    if (!empId) problems.push('no Employee ID');
    if (!name) problems.push('no Name');
    if (!area) problems.push('no Area');
    if (rawSalary === '' || !isFinite(salary) || salary < 0) problems.push('salary is not a valid number');
    if (empId && seen.has(empId.toLowerCase()))
      problems.push(`Employee ID repeats row ${seen.get(empId.toLowerCase())}`);

    // Excel only holds 15 significant digits. A 14-digit account number
    // displayed as 5.01008E+13 is fine — the digits are still there. A 16+
    // digit one stored as a number has genuinely lost its tail.
    const acRaw = cell(r, 'account_no');
    const acWasNumber = typeof gridR[r]?.[cols['account_no']] === 'number';
    if (/e\+/i.test(acRaw))
      problems.push('account number unreadable — format that column as Text in Excel');
    else if (acWasNumber && acRaw.replace(/\D/g, '').length > 15)
      problems.push('account number is too long for Excel to hold as a number — format that column as Text and re-enter it');

    if (problems.length) { bad.push({ line: r + 1, empId, name, why: problems.join(', ') }); continue; }
    seen.set(empId.toLowerCase(), r + 1);

    // Only send columns the sheet actually has. Anything absent is left
    // untouched on existing staff instead of being wiped.
    const rec = { emp_id: empId, name, area, monthly_salary: salary };
    if (has('bank_name'))  rec.bank_name  = cell(r, 'bank_name');
    if (has('account_no')) rec.account_no = acRaw;
    if (has('ifsc'))       rec.ifsc       = cell(r, 'ifsc').toUpperCase();
    if (has('designation')) rec.designation = cell(r, 'designation');
    if (has('emp_type')) {
      const t = normKey(cell(r, 'emp_type'));
      rec.emp_type = (t.startsWith('part') || t === 'pt') ? 'Part Time' : 'Full Time';
    }
    if (has('active')) {
      const st = normKey(cell(r, 'active'));
      rec.active = !(st.startsWith('inactive') || st === 'no' || st === 'false' || st === '0');
    }
    rec._existing = byEmpId.has(empId.toLowerCase());
    good.push(rec);
  }

  showPreview(good, bad);
}

function showPreview(good, bad) {
  const adds = good.filter((g) => !g._existing).length;
  const upds = good.filter((g) => g._existing).length;
  const total = good.reduce((s, g) => s + (g.active === false ? 0 : g.monthly_salary), 0);

  openModal('Check before importing', `
    <div style="margin-bottom:14px">
      <span class="pill pill-new">${adds} new</span>
      <span class="pill pill-upd">${upds} to update</span>
      ${bad.length ? `<span class="pill pill-bad">${bad.length} skipped</span>` : ''}
    </div>

    ${good.length ? `
      <div class="preview">
        <table><thead><tr>
          <th>Employee</th><th>Area</th><th>Designation</th><th>Type</th>
          <th class="r">Salary</th><th>Status</th><th></th>
        </tr></thead><tbody>
        ${good.map((g) => `<tr>
          <td><div style="font-weight:500">${esc(g.name)}</div><div class="sub">${esc(g.emp_id)}</div></td>
          <td>${esc(g.area)}</td>
          <td>${esc(g.designation ?? '—')}</td>
          <td>${g.emp_type
                ? `<span class="tag ${g.emp_type === 'Full Time' ? 'tag-ft' : 'tag-pt'}">${esc(g.emp_type)}</span>`
                : '<span class="sub">unchanged</span>'}</td>
          <td class="r mono">${money(g.monthly_salary)}</td>
          <td class="sub">${g.active === undefined ? 'unchanged' : (g.active ? 'Active' : 'Inactive')}</td>
          <td class="sub">${g._existing ? 'update' : 'new'}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      <p class="note">Adds ${money(total)} of active salary to the register.</p>
    ` : '<p style="font-size:14px">Nothing in this file can be imported.</p>'}

    ${bad.length ? `
      <p class="eyebrow" style="margin:18px 0 6px">Skipped rows</p>
      <div class="preview">
        <table><thead><tr><th>Sheet row</th><th>Who</th><th>Problem</th></tr></thead><tbody>
        ${bad.map((b) => `<tr class="badrow">
          <td class="mono">${b.line}</td>
          <td>${esc(b.name || b.empId || '—')}</td>
          <td>${esc(b.why)}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      <p class="note">Fix these in your sheet and import again — the rest will just update, nothing gets duplicated.</p>
    ` : ''}

    <div id="importErr2" class="err hidden"></div>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-green" id="doImport" ${good.length ? '' : 'disabled'}>
        Import ${good.length} employee${good.length === 1 ? '' : 's'}
      </button>
    </div>`, 'lg');

  $('doImport').onclick = async () => {
    const btn = $('doImport');
    btn.disabled = true; btn.textContent = 'Importing…';
    const payload = good.map(({ _existing, ...rest }) => rest);

    const { error } = await sb.from('employees')
      .upsert(payload, { onConflict: 'emp_id' });

    if (error) {
      btn.disabled = false; btn.textContent = 'Try again';
      const e2 = $('importErr2');
      e2.textContent = `Import failed: ${error.message}`;
      e2.classList.remove('hidden');
      return;
    }
    closeModal();
    await load();
  };
}

    </div>`);

  $('dlCsvBtn').onclick = () => {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `staff-${new Date().toISOString().slice(0, 10)}.csv`;

    btn.disabled = true; btn.textContent = 'Building…';
    try {
      const XLSX = await loadSheetJS();

      const aoa = [TEMPLATE_HEADERS];
      rows.forEach((e) => aoa.push([
        String(e.emp_id ?? ''),
        String(e.name ?? ''),
        String(e.bank_name ?? ''),
        String(e.account_no ?? ''),
        String(e.ifsc ?? ''),
        String(e.area ?? ''),
        String(e.designation ?? ''),
        String(e.emp_type ?? ''),
        Number(e.monthly_salary || 0),
        e.active ? 'Active' : 'Inactive',
      ]));
      aoa.push([]);
      aoa.push([`Total monthly payout (active, ${filterLabel()})`, '', '', '', '', '', '', '', total, '']);

      const ws = XLSX.utils.aoa_to_sheet(aoa);

      // Force the identifier columns to real text cells so Excel cannot
      // turn a 14-digit account number back into scientific notation.
      const textCols = ['A', 'D', 'E'];   // Employee ID, Account No, IFSC
      for (let r = 2; r <= aoa.length; r++) {
        textCols.forEach((col) => {
          const c = ws[col + r];
          if (c && c.v !== '') { c.t = 's'; c.v = String(c.v); c.z = '@'; }
        });
      }

      ws['!cols'] = [{ wch: 12 }, { wch: 24 }, { wch: 20 }, { wch: 24 }, { wch: 14 },
                     { wch: 12 }, { wch: 20 }, { wch: 14 }, { wch: 14 }, { wch: 10 }];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Staff');
      XLSX.writeFile(wb, `staff-${new Date().toISOString().slice(0, 10)}.xlsx`);

      btn.disabled = false; btn.textContent = 'Download Excel';
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Try again';
      const e2 = $('exportErr');
      e2.textContent = `Couldn't build the Excel file: ${err.message}`;
      e2.classList.remove('hidden');
    }
  };
};

  if (error) {
    $('payrollView').innerHTML = `<div class="empty">Couldn't load payroll: ${esc(error.message)}</div>`;
    return;

  runs = data || [];
  if (currentRun && !runs.find((r) => r.id === currentRun.id)) currentRun = null;
  currentRun ? openRun(currentRun.id) : renderRunList();
}

function newRun() {
  const now = new Date();
  const months = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
    const period = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const label = d.toLocaleString('en-IN', { month: 'long', year: 'numeric' });
    if (!runs.find((r) => r.period === period)) months.push({ period, label });
  }

  openModal('New payroll month', `
    <label class="f eyebrow">Month</label>
    <select id="runMonth">
      ${months.map((m) => `<option value="${m.period}">${esc(m.label)}</option>`).join('')}
    </select>
    <p class="note">Months already started aren't listed. Open those from the list instead.</p>
    <div id="runErr" class="err hidden"></div>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-green" id="createRun" ${months.length ? '' : 'disabled'}>Create</button>
    </div>`, 'sm');

  $('createRun').onclick = async () => {
    const period = $('runMonth').value;
    const label = months.find((m) => m.period === period).label;
    const { data: { user } } = await sb.auth.getUser();
    const { data, error } = await sb.from('payroll_runs')
      .insert({ period, label, created_by: user.id }).select().single();
    if (error) {
      const e = $('runErr');
      e.textContent = `Couldn't create: ${error.message}`;
      e.classList.remove('hidden');
      return;
    }
    closeModal();
    runs.unshift(data);
    openRun(data.id);
  };
}

async function openRun(id) {

  const { data } = await sb.from('payroll_files').select('*').eq('run_id', id);
  runFiles = data || [];
  renderRun();
}

async function downloadTemplate(kind) {
  const cfg = SHEET_KINDS[kind];
  const XLSX = await loadSheetJS();
  const aoa = [cfg.headers, ...cfg.sample];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // keep ID columns as text so Excel never reformats them
  for (let r = 2; r <= aoa.length; r++) {
    cfg.textCols.forEach((col) => {
      const c = ws[col + r];
      if (c && c.v !== '') { c.t = 's'; c.v = String(c.v); c.z = '@'; }
    });
  }
  ws['!cols'] = cfg.headers.map((h) => ({ wch: Math.max(12, h.length + 4) }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label);
  XLSX.writeFile(wb, `${kind}-template.xlsx`);
}

/* ---------------------------- uploading ---------------------------- */
function pickSheet(kind) {
  const fi = $('fileInput');
  fi.value = '';
  fi.onchange = () => { if (fi.files[0]) parseSheet(kind, fi.files[0]); };
  fi.click();
}

async function parseSheet(kind, file) {
  const cfg = SHEET_KINDS[kind];
  let gridF, gridR;
  try {
    const XLSX = await loadSheetJS();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    gridF = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '', raw: false });
    gridR = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '', raw: true });
  } catch (e) {
    return alert(`Couldn't read that file: ${e.message}`);
  }
  if (!gridF || gridF.length < 2)
    return alert('That sheet looks empty. It needs a heading row plus at least one row of data.');

  // The heading row isn't always the first row — exports often start with a
  // title and a blank line. Score the first 15 rows and take the best one.
  const scoreRow = (row) => (row || []).map(normKey).reduce((n, h) => {
    if (!h) return n;
    if (cfg.map[h]) return n + 1;
    if (cfg.dayGrid && /^(\d{1,2})(mo|tu|we|th|fr|sa|su)?$/.test(h)) return n + 1;
    return n;
  }, 0);

  let hdr = 0, best = -1;
  for (let r = 0; r < Math.min(15, gridF.length); r++) {
    const sc = scoreRow(gridF[r]);
    if (sc > best) { best = sc; hdr = r; }
  }
  if (best < 2)
    return headingError(cfg,
      "Couldn't find a heading row in this file.",
      'The sheet needs a row of column headings, with the employee rows underneath it.',
      (gridF[0] || []).map((h) => String(h ?? '').trim()).filter(Boolean));

  const cols = {};
  const dayCols = {};                       // { 1: colIndex, 2: colIndex, ... }
  const dayNames = {};                      // { 1: 'we', 5: 'su', ... }
  gridF[hdr].map(normKey).forEach((h, i) => {
    const f = cfg.map[h];
    if (f && cols[f] === undefined) { cols[f] = i; return; }
    // day-grid headings look like "1", "1We", "15Tu" — the day number leads
    if (cfg.dayGrid) {
      const m = h.match(/^(\d{1,2})(mo|tu|we|th|fr|sa|su)?$/);
      if (m) {
        const d = Number(m[1]);
        if (d >= 1 && d <= 31 && dayCols[d] === undefined) {
          dayCols[d] = i;
          if (m[2]) dayNames[d] = m[2];      // 'we', 'su', …
        }
      }
    }
  });

  const nice = { emp_id: 'Employee ID', name: 'Employee Name', amount: 'Amount', date: 'Date' };
  const missing = cfg.need.filter((f) => cols[f] !== undefined ? false : f !== 'emp_id');
  if (missing.length) {
    const found = gridF[hdr].map((h) => String(h ?? '').replace(/\s+/g, ' ').trim())
                            .filter(Boolean);
    return headingError(cfg,
      `Missing column${missing.length > 1 ? 's' : ''}: <b>${missing.map((m) => esc(nice[m] || m)).join(', ')}</b>.`,
      'The first row of the sheet has to be the column headings.',
      found);
  }

  if (!cfg.noEmp && cols.emp_id === undefined) {
    const found = gridF[hdr].map((h) => String(h ?? '').replace(/\s+/g, ' ').trim())
                            .filter(Boolean);
    return headingError(cfg,
      'This sheet has no <b>Employee ID</b> column, so nothing can be uploaded.',
      `Rows are matched to people by Employee ID only — never by name, because
       two people can share a name and one wrong match means one wrong payment.`,
      found);
  }

  const cell = (r, f) => {
    const i = cols[f];
    if (i === undefined) return '';
    const rv = gridR[r]?.[i];
    if (rv instanceof Date) return rv.toISOString().slice(0, 10);
    if (typeof rv === 'number' && isFinite(rv))
      return Number.isInteger(rv) ? rv.toFixed(0) : String(rv);
    const shown = String(gridF[r]?.[i] ?? '').trim();
    return shown || String(rv ?? '').trim();
  };

  const known = new Map(staff.map((e) => [String(e.emp_id).toLowerCase(), e]));
  const good = [], bad = [];

  // The calendar for the month this run is for. Day codes in the sheet are
  // positional, so knowing which of them are Sundays comes from here.
  const cal = monthCalendar(currentRun.period);
  const calWarn = calendarMismatch(cal, dayNames);

  for (let r = hdr + 1; r < gridF.length; r++) {
    if (!gridF[r] || gridF[r].every((c) => String(c ?? '').trim() === '')) continue;

    const rec = {};
    const problems = [];

    Object.keys(cols).forEach((f) => { rec[f] = cell(r, f); });

    cfg.numeric.forEach((f) => {
      if (rec[f] === undefined) return;
      if (rec[f] === '') { rec[f] = 0; return; }
      const n = Number(String(rec[f]).replace(/[₹,\s]/g, ''));
      if (!isFinite(n)) { problems.push(`${f.replace(/_/g, ' ')} is not a number`); return; }
      if ((cfg.positive || []).includes(f) && n < 0)
        problems.push(`${f.replace(/_/g, ' ')} is negative`);
      rec[f] = n;
    });

    if (cfg.need.includes('emp_id') && !rec.emp_id) problems.push('no Employee ID');
    if (cfg.need.includes('amount') && rec.amount === 0 && cell(r, 'amount') === '')
      problems.push('no amount');

    // day grid: keep each day's code so we can tell later who worked a holiday
    if (cfg.dayGrid && Object.keys(dayCols).length) {
      const days = {};
      Object.entries(dayCols).forEach(([d, i]) => {
        const v = String(gridF[r]?.[i] ?? '').trim();
        if (v) days[d] = v;
      });
      if (Object.keys(days).length) {
        rec.days = days;
        // count the Sundays this person was marked present, for later use
        rec.sundays_in_month = cal.sundays.length;
        rec.sunday_codes = cal.sundays.map((d) => days[d] || '').filter(Boolean).join(',');
      }
    }

    // Identity comes from Employee ID and nothing else. The name column is
    // only ever used to cross-check that the ID points at who Sachin meant.
    let resolvedId = null, matched = false, nameWarn = null;
    if (!cfg.noEmp) {
      if (!rec.emp_id) {
        problems.push('no Employee ID');
      } else {
        resolvedId = String(rec.emp_id);
        const hit = known.get(resolvedId.toLowerCase());
        if (hit) {
          matched = true;
          if (rec.name && normKey(rec.name) !== normKey(hit.name)) nameWarn = hit.name;
        }
      }
    }

    if (kind === 'holiday') {
      const d = parseDMY(rec.date);
      if (!d) problems.push(`date "${rec.date}" not understood — use dd/mm/yy`);
      else rec.date = d;
    }

    if (problems.length) {
      bad.push({ line: r + 1, who: rec.name || rec.emp_id || rec.date || '—', why: problems.join(', ') });
      continue;
    }

    good.push({
      row_no: r + 1,
      emp_id: cfg.noEmp ? null : resolvedId,
      matched: cfg.noEmp ? true : matched,
      nameWarn,
      data: rec,
    });
  }

  // Catch the classic mistake: a serial-number column relabelled "Employee ID".
  // Sequential 1,2,3… will still match real employees by accident and pay the
  // wrong people, so it has to be refused rather than warned about.
  if (!cfg.noEmp && good.length >= 5) {
    const ids = good.map((g) => g.emp_id);
    const looksSerial = ids.every((v, i) => String(v) === String(i + 1));
    if (looksSerial) {
      const mismatch = good.filter((g) => g.nameWarn).length;
      return headingError(cfg,
        'The <b>Employee ID</b> column contains 1, 2, 3, … — these are row numbers, not employee IDs.',
        `Uploading this would attach rows to whoever happens to hold IDs 1, 2, 3
         in the register${mismatch ? ` — ${mismatch} row${mismatch === 1 ? ' already disagrees' : 's already disagree'} with the name on that ID` : ''}.
         The export needs to output each person's real Employee ID.`,
        gridF[hdr].map((h) => String(h ?? '').replace(/\s+/g, ' ').trim()).filter(Boolean));
    }
  }

  previewSheet(kind, file.name, good, bad, cfg.dayGrid ? { cal, calWarn } : null);
}

    </div>

    <p class="eyebrow" style="margin:0 0 6px">Headings found in your file</p>
    <div class="fieldlist" style="margin-bottom:16px">
      ${foundHeadings.length ? foundHeadings.slice(0, 40).map(esc).join(' · ') : '(none)'}
      ${foundHeadings.length > 40 ? ' …' : ''}
    </div>

    <p style="font-size:13.5px;color:var(--ink-soft);margin:0">
      Fix the heading row in Excel and upload again. The Template button gives
      you a file with the headings already correct.
    </p>

    <div class="foot">
      <button class="btn btn-ghost" data-close>Close</button>
      <button class="btn btn-green" id="tplFromErr">Download template</button>
    </div>`, 'lg');

  $('tplFromErr').onclick = () => downloadTemplate(
    Object.keys(SHEET_KINDS).find((k) => SHEET_KINDS[k] === cfg));
}

const WD = ['su', 'mo', 'tu', 'we', 'th', 'fr', 'sa'];

// { days, sundays: [5,12,19,26], weekday: { 1:'we', 2:'th', … }, label }
function monthCalendar(period) {
  const [y, m] = String(period).split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const weekday = {}, sundays = [];
  for (let d = 1; d <= days; d++) {
    const wd = WD[new Date(y, m - 1, d).getDay()];
    weekday[d] = wd;
    if (wd === 'su') sundays.push(d);
  }
  return { year: y, month: m, days, weekday, sundays };
}

// does the sheet's own day labelling agree with the real calendar?
function calendarMismatch(cal, dayNames) {
  const labelled = Object.keys(dayNames);
  if (!labelled.length) return null;
  const wrong = labelled.filter((d) => dayNames[d] !== cal.weekday[d]);
  if (!wrong.length) return null;
  const d = wrong[0];
  return `The sheet labels day ${d} as ${dayNames[d].toUpperCase()}, but in this ` +
         `month it is a ${cal.weekday[d].toUpperCase()}. The sheet may be for a ` +
         `different month.`;
}

function parseDMY(v) {
  if (!v) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;               // already ISO
  const m = String(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (!m) return null;
  let [, d, mo, y] = m;
  y = y.length === 2 ? '20' + y : y;
  const dt = new Date(Number(y), Number(mo) - 1, Number(d));
  if (dt.getMonth() !== Number(mo) - 1) return null;          // 31/02 etc
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function previewSheet(kind, filename, good, bad, calInfo) {
  const cfg = SHEET_KINDS[kind];
  const unmatched = good.filter((g) => !g.matched).length;
  const nameWarns = good.filter((g) => g.nameWarn);
  const nameOf = new Map(staff.map((e) => [String(e.emp_id).toLowerCase(), e.name]));

  const cellOut = (g, f, fmt) => {
    const v = f === 'emp_id' ? (g.emp_id ?? '') : g.data[f];
    if (f === 'emp_id' && !g.matched)
      return `<span style="color:var(--rose)">${esc(v || '—')} ?</span>`;
    if (fmt === 'money') return money(v);
    return esc(v === '' || v === undefined || v === null ? '—' : v);
  };

  openModal(`${cfg.label} sheet — check before saving`, `
    <div style="margin-bottom:14px">
      <span class="pill pill-new">${good.length} row${good.length === 1 ? '' : 's'}</span>
      ${unmatched ? `<span class="pill pill-upd">${unmatched} unmatched ID</span>` : ''}
      ${bad.length ? `<span class="pill pill-bad">${bad.length} skipped</span>` : ''}
    </div>

    ${unmatched ? `<p style="font-size:13.5px;color:var(--amber);margin:0 0 12px">
      Some rows couldn't be matched to anyone in the staff register. They are
      saved but marked, so nothing silently disappears — check them before the
      month is run.
    </p>` : ''}

    ${calInfo ? `<p style="font-size:13.5px;margin:0 0 12px;color:var(--ink-soft)">
      ${esc(currentRun.label)} has <b>${calInfo.cal.days} days</b> and
      <b>${calInfo.cal.sundays.length} Sundays</b>
      (${calInfo.cal.sundays.join(', ')}).
    </p>` : ''}

    ${calInfo && calInfo.calWarn ? `<p style="font-size:13.5px;color:var(--rose);margin:0 0 12px">
      ${esc(calInfo.calWarn)}
    </p>` : ''}

    ${nameWarns.length ? `<p style="font-size:13.5px;color:var(--amber);margin:0 0 12px">
      ${nameWarns.length} row${nameWarns.length === 1 ? '' : 's'} where the name in
      the sheet doesn't match the name on that Employee ID in the register. The ID
      decides who gets paid, so check these before saving.
    </p>` : ''}

    ${good.length ? `
      <div class="preview">
        <table><thead><tr>
          ${cfg.show.map(([, label]) => `<th>${esc(label)}</th>`).join('')}
          ${cfg.noEmp ? '' : '<th>In register</th>'}
        </tr></thead><tbody>
        ${good.slice(0, 200).map((g) => `<tr${g.matched ? '' : ' class="badrow"'}>
          ${cfg.show.map(([f, , fmt]) => `<td>${cellOut(g, f, fmt)}</td>`).join('')}
          ${cfg.noEmp ? '' : `<td class="sub">${
          g.matched
            ? (g.nameWarn
                ? `<span style="color:var(--amber)">${esc(g.nameWarn)} ⚠</span>`
                : esc(nameOf.get(String(g.emp_id).toLowerCase())))
            : 'not found'}</td>`}
        </tr>`).join('')}
        </tbody></table>
      </div>
      ${good.length > 200 ? `<p class="note">Showing the first 200 of ${good.length} rows.</p>` : ''}
    ` : '<p style="font-size:14px">Nothing in this file can be saved.</p>'}

    ${bad.length ? `
      <p class="eyebrow" style="margin:18px 0 6px">Skipped rows</p>
      <div class="preview">
        <table><thead><tr><th>Sheet row</th><th>Who</th><th>Problem</th></tr></thead><tbody>
        ${bad.map((b) => `<tr class="badrow">
          <td class="mono">${b.line}</td><td>${esc(b.who)}</td><td>${esc(b.why)}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>` : ''}

    <div id="upErr" class="err hidden"></div>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-green" id="saveSheet" ${good.length ? '' : 'disabled'}>
        Save ${good.length} row${good.length === 1 ? '' : 's'}
      </button>
    </div>`, 'lg');

  $('saveSheet').onclick = async () => {
    const btn = $('saveSheet');
    btn.disabled = true; btn.textContent = 'Saving…';
    const fail = (m) => {
      btn.disabled = false; btn.textContent = 'Try again';
      const e = $('upErr'); e.textContent = m; e.classList.remove('hidden');
    };

    const { data: { user } } = await sb.auth.getUser();

    // replacing a sheet: the old file row goes, and its rows go with it
    const existing = runFiles.find((f) => f.kind === kind);
    if (existing) {
      const { error } = await sb.from('payroll_files').delete().eq('id', existing.id);
      if (error) return fail(`Couldn't replace the old sheet: ${error.message}`);
    }

    const { data: fileRow, error: fErr } = await sb.from('payroll_files').insert({
      run_id: currentRun.id, kind, filename,
      row_count: good.length, unmatched, uploaded_by: user.id,
    }).select().single();
    if (fErr) return fail(`Couldn't save: ${fErr.message}`);

    const payload = good.map((g) => ({
      file_id: fileRow.id, run_id: currentRun.id, kind,
      emp_id: g.emp_id, row_no: g.row_no, matched: g.matched, data: g.data,
    }));

    for (let i = 0; i < payload.length; i += 400) {
      const { error } = await sb.from('payroll_rows').insert(payload.slice(i, i + 400));
      if (error) {
        await sb.from('payroll_files').delete().eq('id', fileRow.id);
        return fail(`Couldn't save the rows: ${error.message}`);
      }
    }

    closeModal();
    await openRun(currentRun.id);
  };
}

/* ------------------------- view / remove --------------------------- */
async function viewSheet(kind) {
  const cfg = SHEET_KINDS[kind];
  const { data, error } = await sb.from('payroll_rows')
    .select('*').eq('run_id', currentRun.id).eq('kind', kind).order('row_no');
  if (error) return alert(`Couldn't load: ${error.message}`);

  const nameOf = new Map(staff.map((e) => [String(e.emp_id).toLowerCase(), e.name]));
  const rows = data || [];

  openModal(`${cfg.label} — ${currentRun.label}`, `
    <p style="margin:0 0 12px;font-size:14px">${rows.length} row${rows.length === 1 ? '' : 's'}</p>
    <div class="preview">
      <table><thead><tr>
        ${cfg.show.map(([, l]) => `<th>${esc(l)}</th>`).join('')}
        ${cfg.noEmp ? '' : '<th>In register</th>'}
      </tr></thead><tbody>
      ${rows.map((r) => `<tr${r.matched ? '' : ' class="badrow"'}>
        ${cfg.show.map(([f, , fmt]) =>
          `<td>${fmt === 'money' ? money(r.data[f]) : esc(r.data[f] ?? '—')}</td>`).join('')}
        ${cfg.noEmp ? '' : `<td class="sub">${r.matched ? esc(nameOf.get(String(r.emp_id).toLowerCase())) : 'not found'}</td>`}
      </tr>`).join('')}
      </tbody></table>
    </div>
    <div class="foot"><button class="btn btn-ghost" data-close>Close</button></div>`, 'lg');
}

function removeSheet(kind) {
  const f = runFiles.find((x) => x.kind === kind);
  if (!f) return;
  openModal('Remove sheet', `
    <p style="margin:0;font-size:14px">
      Remove the ${esc(SHEET_KINDS[kind].label.toLowerCase())} sheet for
      ${esc(currentRun.label)}? Its ${f.row_count} rows are deleted and you
      can upload a fresh file.
    </p>
    <div class="foot">
      <button class="btn btn-ghost" data-close>Keep it</button>
      <button class="btn btn-rose" id="doRemove">Remove</button>
    </div>`, 'sm');

  $('doRemove').onclick = async () => {
    const { error } = await sb.from('payroll_files').delete().eq('id', f.id);
    if (error) return alert(`Couldn't remove: ${error.message}`);
    closeModal();
    await openRun(currentRun.id);
  };
}

/* ------------------------------ modal ------------------------------ */
function openModal(title, bodyHtml, size = '') {
  $('modalHost').innerHTML = `
    <div class="veil">
      <div class="modal ${size}">
        <div class="head"><h2>${esc(title)}</h2>
          <button class="iconbtn" data-close style="font-size:18px">✕</button></div>
        <div class="body">${bodyHtml}</div>
      </div>
    </div>`;
  $('modalHost').querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeModal));
  $('modalHost').querySelector('.veil').onclick = (e) => {
    if (e.target.classList.contains('veil')) closeModal();
  };
}
function closeModal() { $('modalHost').innerHTML = ''; }

/* --------------------------- boot / resume ------------------------- */
const { data: { session } } = await sb.auth.getSession();
if (session) await start();
</script>
</body>
</html>
